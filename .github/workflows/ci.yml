name: MediVoice AI CI Quality Gate Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-test:
    name: Backend Unit, Contract & pglite DB Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        run: cd backend && npm install

      - name: Execute Vitest Backend Test Suite with V8 Coverage
        run: cd backend && npm test -- --coverage

      - name: Upload Backend Coverage Report to Codecov
        uses: codecov/codecov-action@v3
        continue-on-error: true
        with:
          files: ./backend/coverage/lcov.info
          flags: backend
          name: backend-coverage

  frontend-test:
    name: Frontend Unit, RTL & MSW Component Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: cd frontend && npm install

      - name: Execute Frontend Typecheck & Build
        run: cd frontend && npm run build

      - name: Execute Vitest Frontend Test Suite with Coverage
        run: cd frontend && npm test -- --coverage

      - name: Upload Frontend Coverage Report to Codecov
        uses: codecov/codecov-action@v3
        continue-on-error: true
        with:
          files: ./frontend/coverage/lcov.info
          flags: frontend
          name: frontend-coverage

  e2e-playwright:
    name: Playwright End-to-End Suite
    needs: [backend-test, frontend-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Workspace Dependencies
        run: |
          npm install
          cd backend && npm install
          cd ../frontend && npm install

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps

      - name: Execute Playwright E2E Tests
        run: npx playwright test

      - name: Upload Playwright Test Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
