name: Nightly Chaos & Resilience Verification

on:
  schedule:
    - cron: '0 2 * * *' # Run nightly at 02:00 UTC
  workflow_dispatch:

jobs:
  chaos-resilience-suite:
    name: Execute 4-Tier Chaos Engineering Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: |
          npm install
          cd backend && npm install

      - name: Execute Chaos Test Suite
        run: npx vitest run chaos-tests

