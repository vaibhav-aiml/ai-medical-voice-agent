name: Nightly Chaos & Resilience Verification

on:
  schedule:
    - cron: '0 2 * * *' # Run nightly at 02:00 UTC
  workflow_dispatch:

jobs:
  chaos-resilience-suite:
    name: Execute 4-Tier Chaos Engineering Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Backend Dependencies
        run: cd backend && npm ci

      - name: Execute Chaos Test Suite
        run: cd backend && npx vitest run ../chaos-tests/
